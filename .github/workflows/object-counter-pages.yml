name: Object counter → GitHub Pages

# Builds projects/object-counter (browser-only: AI runs on the device, no backend)
# and publishes it at https://<owner>.github.io/<repo>/
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "projects/object-counter/**"
      - ".github/workflows/object-counter-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: object-counter-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/object-counter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/object-counter/server/requirements.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: projects/object-counter/server/weights
          key: oc-weights-v1

      - name: Export browser models (ONNX)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt
          python server/export_models.py --bundled

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/object-counter/web/package-lock.json

      - name: Build web app
        working-directory: projects/object-counter/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/object-counter/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
