# Copy this file to .github/workflows/build-android.yml to enable it.
# It builds, tests and signs the APK on every push that touches the game.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "godot-mobile-game/**"
      - ".github/workflows/build-android.yml"

env:
  GODOT_VERSION: "4.4"
  PROJECT_DIR: godot-mobile-game

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Install export templates
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j -o templates.tpz "templates/android_*" "templates/version.txt" -d "$dest"

      - name: Configure signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storetype PKCS12 \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          mkdir -p "$HOME/.config/godot"
          settings="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          {
            printf '[gd_resource type="EditorSettings" format=3]\n\n'
            printf '[resource]\n'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/debug_keystore = "%s/debug.keystore"\n' "$HOME"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } > "$settings"
          cat "$settings"
          # A release keystore is optional: without it the job builds a debug APK.
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
          fi

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import

      - name: Run gameplay smoke test
        run: godot --headless --path "$PROJECT_DIR" tests/smoke.tscn

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          mkdir -p "$PROJECT_DIR/build"
          if [ -f "$HOME/release.keystore" ] && [ -n "${GODOT_ANDROID_KEYSTORE_RELEASE_USER:-}" ]; then
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/release.keystore"
            godot --headless --path "$PROJECT_DIR" --export-release "Android" build/PrismRun.apk
          else
            echo "No release keystore configured, building a debug APK."
            godot --headless --path "$PROJECT_DIR" --export-debug "Android" build/PrismRun.apk
          fi
          ls -la "$PROJECT_DIR/build"

      - name: Verify signature
        run: |
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --verbose \
            "$PROJECT_DIR/build/PrismRun.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PrismRun-apk
          path: ${{ env.PROJECT_DIR }}/build/PrismRun.apk
          if-no-files-found: error
